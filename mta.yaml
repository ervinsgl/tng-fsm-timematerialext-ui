# ============================================================
#  SANDBOX / LOCAL ONLY — DO NOT COMMIT TO THE DEVOPS REPO
#  Personal test instance. The official DEV app is owned by
#  the pipeline and uses the "-dev" names/route.
#  NEVER copy the "-sandbox" name or route into the repo's
#  manifest.yaml / mta.yaml — it would hijack the DEV route.
#  Repo files must keep: app/ID/route = ...-dev
# ============================================================

_schema-version: "3.2"
ID: tns.fsm.timematerialext.ui.sandbox
version: 1.0.0
description: T&M Journal — FSM Time & Material reporting extension (side-by-side, Node.js/Express + SAPUI5)

parameters:
  enable-parallel-deployments: true

modules:
  - name: tns-fsm-timematerialext-ui-sandbox
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      command: npm start
      memory: 512M
      disk-quota: 512M
      # Route pinned to the existing dev host so FSM does not need repointing.
      # For QA/Prod, override 'routes' (and the module/app suffix) via a per-node .mtaext.
      routes:
        - route: tns-fsm-timematerialext-ui-sandbox-fsm-dev-op.cfapps.eu10-004.hana.ondemand.com
    requires:
      - name: fsm-timematerialext-destination
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev
      ignore:
        - ".git/"
        - "docs/"
        - "dist/"
        - "resources/"
        - "mta_archives/"
        - "*.mtaext"

resources:
  # Reuse the EXISTING destination instance (not managed/created by this MTA).
  - name: fsm-timematerialext-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: fsm-timematerialext-destination-dev